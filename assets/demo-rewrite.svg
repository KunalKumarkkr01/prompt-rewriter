though build succeeded, condition is</text><text x="46" y="97" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#9c9187" xml:space="preserve">succeeded() and dependsOn: Build. why?</text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3324;0.3491;0.9467;0.9633;1.0000" dur="15s" repeatCount="indefinite"/></g><g opacity="0"><text x="28" y="130.6" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#6f665e">⎿</text><text x="46" y="130.6" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#ede6dd" xml:space="preserve"><tspan fill="#ede6dd">Rewrite is in the box (</tspan><tspan fill="#8fc79a">devops-cloud + debug</tspan><tspan fill="#ede6dd">; no web search needed). Review or edit it, then</tspan></text><text x="46" y="151.6" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#ede6dd" xml:space="preserve"><tspan fill="#ede6dd">Enter to send.</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5724;0.5891;0.9467;0.9633;1.0000" dur="15s" repeatCount="indefinite"/></g><rect x="24" y="202" width="912" height="64" rx="8" fill="none" stroke="#e08a5f" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5724;0.5891;0.9467;0.9633;1.0000" dur="15s" repeatCount="indefinite"/></rect><g opacity="0"><text x="58" y="228" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#ede6dd">My Azure DevOps pipeline skips the deploy stage even though the build succeeded. The deploy</tspan></text><text x="58" y="249" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#ede6dd">stage has the condition </tspan><tspan fill="#f0b98d">`succeeded()`</tspan><tspan fill="#ede6dd"> and </tspan><tspan fill="#f0b98d">`dependsOn: Build`</tspan><tspan fill="#ede6dd">. Why is this happening?</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5724;0.5891;0.9467;0.9633;1.0000" dur="15s" repeatCount="indefinite"/></g><g opacity="0"><text x="28" y="294" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e08a5f">✻ <tspan fill="#9c9187">Classifying… (/rewrite-cancel to cancel)</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3544;0.3624;0.4691;0.4771;1.0000" dur="15s" repeatCount="indefinite"/></g><g opacity="0"><text x="28" y="294" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e08a5f">✻ <tspan fill="#9c9187">Rewriting… (/rewrite-cancel to cancel)</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4611;0.4691;0.5891;0.5971;1.0000" dur="15s" repeatCount="indefinite"/></g><g opacity="0"><text x="28" y="294" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8fc79a">● <tspan fill="#9c9187">Rewrite ready: Enter to send · /rewrite-again · /rewrite-cancel</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.5811;0.5891;0.9467;0.9547;1.0000" dur="15s" repeatCount="indefinite"/></g></svg>