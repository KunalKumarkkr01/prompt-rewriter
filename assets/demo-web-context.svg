inite"/></g><g opacity="0"><text x="28" y="109.6" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#6f665e">⎿</text><text x="46" y="109.6" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#ede6dd" xml:space="preserve"><tspan fill="#ede6dd">Rewrite is in the box (</tspan><tspan fill="#8fc79a">frontend + feature</tspan><tspan fill="#ede6dd">; web context from &quot;Next.js latest version upgrade</tspan></text><text x="46" y="130.6" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" fill="#ede6dd" xml:space="preserve"><tspan fill="#ede6dd">guide breaking changes from Next.js 14&quot;). Review or edit it, then Enter to send.</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4683;0.4815;0.9579;0.9711;1.0000" dur="19s" repeatCount="indefinite"/></g><rect x="24" y="181" width="912" height="232" rx="8" fill="none" stroke="#e08a5f" stroke-width="1.5" opacity="0"><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4683;0.4815;0.9579;0.9711;1.0000" dur="19s" repeatCount="indefinite"/></rect><g opacity="0"><text x="58" y="207" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#ede6dd">Upgrade the project from Next.js 14 to the latest version, and fix any breaking changes.</tspan></text><text x="58" y="228" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"></text><text x="58" y="249" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" font-weight="600" xml:space="preserve"><tspan fill="#8fc79a">Recent context:</tspan></text><text x="58" y="270" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#9c9187">- Next.js 15 makes request APIs like </tspan><tspan fill="#f0b98d">`cookies()`</tspan><tspan fill="#9c9187">, </tspan><tspan fill="#f0b98d">`headers()`</tspan><tspan fill="#9c9187"> and </tspan><tspan fill="#f0b98d">`params`</tspan><tspan fill="#9c9187"> asynchronous. A</tspan></text><text x="58" y="291" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#9c9187">  codemod (</tspan><tspan fill="#f0b98d">`npx @next/codemod@canary upgrade latest`</tspan><tspan fill="#9c9187">) migrates most call sites. Source:</tspan></text><text x="58" y="312" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#9c9187">  https://nextjs.org/docs/app/guides/upgrading/version-15</tspan></text><text x="58" y="333" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#9c9187">- The minimum React version for Next.js 15 is 19. Source:</tspan></text><text x="58" y="354" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#9c9187">  https://nextjs.org/docs/app/guides/upgrading/version-15</tspan></text><text x="58" y="375" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#9c9187">- In Next.js 15, </tspan><tspan fill="#f0b98d">`fetch`</tspan><tspan fill="#9c9187"> requests and GET Route Handlers are no longer cached by default.</tspan></text><text x="58" y="396" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="14" xml:space="preserve"><tspan fill="#9c9187">  Source: https://nextjs.org/blog/next-15</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4683;0.4815;0.9579;0.9711;1.0000" dur="19s" repeatCount="indefinite"/></g><g opacity="0"><text x="28" y="441" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e08a5f">✻ <tspan fill="#9c9187">Classifying… (/rewrite-cancel to cancel)</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2120;0.2183;0.3025;0.3088;1.0000" dur="19s" repeatCount="indefinite"/></g><g opacity="0"><text x="28" y="441" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e08a5f">✻ <tspan fill="#9c9187">Searching the web: Next.js latest version upgrade guide breaking changes from Next.js 14</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.2962;0.3025;0.3867;0.3931;1.0000" dur="19s" repeatCount="indefinite"/></g><g opacity="0"><text x="28" y="441" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#e08a5f">✻ <tspan fill="#9c9187">Rewriting… (/rewrite-cancel to cancel)</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.3804;0.3867;0.4815;0.4878;1.0000" dur="19s" repeatCount="indefinite"/></g><g opacity="0"><text x="28" y="441" font-family="ui-monospace, SFMono-Regular, 'Cascadia Mono', Menlo, Consolas, 'Liberation Mono', monospace" font-size="13" fill="#8fc79a">● <tspan fill="#9c9187">Rewrite ready: Enter to send · /rewrite-again · /rewrite-cancel</tspan></text><animate attributeName="opacity" values="0;0;1;1;0;0" keyTimes="0.0000;0.4752;0.4815;0.9579;0.9642;1.0000" dur="19s" repeatCount="indefinite"/></g></svg>